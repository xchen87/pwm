# Local development database. Port 5433 avoids clashing with any Postgres already on 5432.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pwm
      POSTGRES_PASSWORD: pwm
      POSTGRES_DB: pwm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pwm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwm -d pwm"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pwm_db:
